name: "CIFuzz"

on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  fuzz:
    name: "Fuzz"
    runs-on: "ubuntu-26.04"
    permissions:
      security-events: write # needed to upload SARIF
    steps:
      - name: "Build Fuzzers"
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@1b73904cfccf3addafb6d599b8e0f32e710790cc
        with:
          oss-fuzz-project-name: 'libressl'
          dry-run: false
          language: c++

      - name: "Run Fuzzers"
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@1b73904cfccf3addafb6d599b8e0f32e710790cc
        with:
          oss-fuzz-project-name: 'libressl'
          fuzz-seconds: 300
          dry-run: false
          language: c++
          output-sarif: true

      - name: "Upload Crash"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.build.outcome == 'success'
        with:
          name: "artifacts"
          path: "./out/artifacts"

      - name: "Upload SARIF"
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: "cifuzz-sarif/results.sarif"
          category: "cifuzz-sarif"
