# GitHub Actions workflow to run tests on a FreeBSD VM.
name: "FreeBSD"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # At 00:00 daily.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

env:
  FREEBSD_VERSION: "14.1"

jobs:
  autoconf:
    name: "autoconf"
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'libressl' || github.event_name != 'schedule'
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup"
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libtool
          ./autogen.sh

      - name: "Build on VM"
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: "${{ env.FREEBSD_VERSION }}"
          copyback: false
          prepare: |
            pkg install -y autoconf automake libtool p5-IO-Socket-SSL
          run: |
            perl -MIO::Socket::SSL::Utils -e 1
            ./configure
            make -j2 check || (cat tests/test-suite.log && exit 1)

  cmake:
    name: "cmake"
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'libressl' || github.event_name != 'schedule'
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup"
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libtool
          ./autogen.sh

      - name: "Build on VM"
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: "${{ env.FREEBSD_VERSION }}"
          copyback: false
          prepare: |
            pkg install -y cmake ninja p5-IO-Socket-SSL
          run: |
            perl -MIO::Socket::SSL::Utils -e 1
            export CTEST_OUTPUT_ON_FAILURE=1
            cmake -G Ninja -B build
            ninja -C build
            ninja -C build test
