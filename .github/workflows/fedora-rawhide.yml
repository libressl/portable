name: Fedora/Rawhide

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    strategy:
      matrix:
        cc: [ gcc, clang ]
    name: ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'libressl' || github.event_name != 'schedule' }}
    container:
      image: fedora:rawhide@sha256:0c1f63ed8fb818fad16cf6ae091598c410a21d2e1a9adf183beb93189299bfba
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: |
        dnf -y install git make clang cmake ninja-build autoconf automake libtool diffutils patch gawk perl-IO-Socket-SSL
        perl -MIO::Socket::SSL::Utils -e 1
    - name: Pull upstream source
      run: |
        ./update.sh
    - name: Build
      run: |
         CC=${{ matrix.cc }} cmake -GNinja -DBUILD_SHARED_LIBS=ON .
         ninja
    - name: Test
      run: |
         CTEST_PARALLEL_LEVEL="" ninja test
